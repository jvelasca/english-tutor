<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#6366f1" />
    <title>English Tutor</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("english-tutor.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        // Rampa de niveles: se adelanta el atributo para no ver un parpadeo del
        // esquema por defecto cuando el usuario eligió «Espectro» o «Monocromo».
        try {
          var raw = localStorage.getItem("english-tutor.appearance");
          var scheme = raw ? JSON.parse(raw).levelScheme : null;
          if (
            scheme === "traffic" ||
            scheme === "spectrum" ||
            scheme === "mono"
          ) {
            document.documentElement.setAttribute("data-levels", scheme);
          }
        } catch (e) {
          /* sin apariencia guardada: el esquema por defecto ya es correcto */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
