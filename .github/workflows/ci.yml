name: CI

# V3.75 (VG-N5): cadena de suministro del CI.
#  (1) Todas las Actions van fijadas por **SHA de commit** (con la etiqueta en
#      comentario, para que Dependabot sepa qué actualizar). `@v4`/`@v5` son
#      referencias **móviles**: si la acción cambia, el CI ejecuta otra cosa sin
#      que nada del repositorio cambie.
#  (2) Permisos mínimos: el CI solo **lee** el repositorio.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest tests/ -q
      - name: Validate the transfer instance space (V3.61)
        run: python -m scripts.transfer_validation

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test (vitest)
        run: npm test
      # V3.72 (§UE): el checker i18n pasa a ser gate real (`--strict` falla con
      # claves huérfanas). Solo stdlib: no necesita las dependencias de `backend`.
      - name: i18n coverage gate (huérfanas / duplicadas / vacías)
        working-directory: .
        run: python scripts/check_i18n_coverage.py --strict
      # V3.73.1 (GUI-06): el contraste de la tipografía base sobre las superficies
      # es un gate real. Los pares de acento se miden y se publican en
      # docs/audit/generated/contrast-report.md, pero no bloquean: separar el
      # acento-relleno del acento-texto es una decisión de diseño de V4.0.x.
      - name: Contrast audit (WCAG AA tipografía base)
        run: npm run audit:contrast
      - name: Build
        run: npm run build

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check release consistency
        run: python scripts/check_release_consistency.py

  # V3.73: comprobaciones estáticas del arnés de validación (fail-closed del
  # runtime de producto, descubrimiento de LAN sin referencias externas, jobs
  # Windows, protocolos de los gates en :8000 y sin el dev server, instrumento de
  # red sin deriva).
  # Stdlib pura: no necesita instalar dependencias. `--strict` NO corre aquí a
  # propósito: los 8 gates de validación física son acción humana y estarán
  # `pending` por diseño hasta que se ejecuten.
  validation-gate:
    name: Validation gate (checks automáticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Automatic validation checks
        run: python scripts/validation_gate.py auto

  beta-v3-gate:
    name: Beta V3.0 gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Beta V3 pedagogical freeze gate
        working-directory: .
        run: python scripts/check_beta_v3.py

  content-validation:
    name: Content validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Content integrity check
        run: python scripts/content_validation.py

  playwright:
    name: Playwright E2E (visual)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test

  launcher:
    name: Launcher (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Solo lo que necesitan los tests del launcher (stdlib + pytest/ruff),
          # con las MISMAS versiones que el gate de `backend`.
          python -m pip install pytest==8.4.2 ruff==0.16.3
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  # V3.75 (VG-N5): el escaneo de dependencias deja de ser un acto manual (la
  # auditoría de V3.73 lo hizo a mano y dio 0 vulnerabilidades **ese día**, que es
  # justo lo que un job repite). Bloqueante a propósito: audita lo que se
  # **distribuye**.
  #  - `pip-audit -r backend/requirements.txt`: el árbol de **producto** (fastapi,
  #    uvicorn, faster-whisper, piper, cryptography…), no el de desarrollo
  #    (`requirements-dev.txt`): un aviso en una herramienta de test no debe
  #    bloquear una release del producto.
  #  - `npm audit --omit=dev --audit-level=high`: dependencias de **producción**
  #    del frontend. `--audit-level=high` deja pasar avisos `low`/`moderate` de
  #    una dependencia de build, y `--omit=dev` no audita el árbol de test.
  # Criterio de promoción declarado (si algún día estorba): el job se vuelve
  # `continue-on-error` **con la deuda registrada en `docs/audit/PARKED.md`**, no
  # borrado en silencio.
  deps-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Sin fijar versión a propósito: es la herramienta de auditoría, no una
      # dependencia del producto; lo que aporta es su base de avisos **al día**.
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend (product requirements)
        working-directory: backend
        run: python -m pip_audit -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  product-origin:
    name: Product origin (UI served over HTTPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # V3.72 (RC-01): el backend sirve la UI compilada. Este job arranca el
      # producto de verdad — uvicorn con TLS sobre el `dist` construido — y
      # comprueba que la raíz devuelve HTML, que la API responde en el mismo
      # origen y que un `/api` inexistente sigue siendo 404 (el fallback SPA no
      # enmascara endpoints).
      - name: Build the UI artifact
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Serve the artifact over HTTPS and check the product origin
        working-directory: backend
        run: |
          set -euo pipefail
          python -m scripts.ensure_tls_cert
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 \
            --ssl-certfile data/certs/cert.pem \
            --ssl-keyfile data/certs/key.pem &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 30); do
            if curl -sk https://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          root=$(curl -sk https://127.0.0.1:8000/)
          echo "$root" | head -c 200
          echo "$root" | grep -qi "<html" \
            || { echo "ERROR: la raíz no sirve HTML"; exit 1; }
          curl -sk https://127.0.0.1:8000/api/health | grep -q '"version"' \
            || { echo "ERROR: la API no responde en el origen de producto"; exit 1; }
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            https://127.0.0.1:8000/api/no-existe)
          test "$code" = "404" \
            || { echo "ERROR: /api inexistente devolvió $code (esperaba 404)"; exit 1; }
          echo "OK: la UI compilada se sirve por HTTPS en el origen de producto"

  # V3.73 (bloque C de la auditoría de V3.72): todo el CI corría en Linux, así que
  # el launcher de Windows y el certificado TLS nunca se ejercitaban en su sistema
  # real. Este job no pretende sustituir a la prueba en una máquina Windows (es el
  # gate G3, acción humana): reduce el riesgo de que el launcher rote solo en Linux.
  # Solo necesita stdlib + pytest/ruff, así que es determinista y **bloqueante**.
  launcher-windows:
    name: Launcher (Windows, ruff + pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Las MISMAS versiones que el gate de `backend`.
          python -m pip install pytest==8.4.2 ruff==0.16.3
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  # V3.73: el humo del origen de producto, pero en Windows (donde vive el
  # launcher) y a través de PowerShell. Se estrena como **informativo**
  # (`continue-on-error`) a propósito: instalar `requirements-dev.txt` en Windows
  # depende de ruedas nativas (`piper-tts`, `faster-whisper`) que no se pueden
  # verificar desde Linux. El criterio de promoción a bloqueante está declarado en
  # `release-notes-v3.73.0.md`: pasa a `continue-on-error: false` cuando acumule
  # runs verdes consecutivos.
  product-origin-windows:
    name: Product origin (Windows, informativo)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Build the UI artifact
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Serve the artifact over HTTPS and check the product origin
        working-directory: backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m scripts.ensure_tls_cert
          if ($LASTEXITCODE -ne 0) { throw "ensure_tls_cert falló" }
          $server = Start-Process -FilePath "python" -PassThru -NoNewWindow `
            -ArgumentList @(
              "-m", "uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8000",
              "--ssl-certfile", "data/certs/cert.pem",
              "--ssl-keyfile", "data/certs/key.pem"
            )
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                Invoke-WebRequest -Uri "https://127.0.0.1:8000/api/health" `
                  -SkipCertificateCheck -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "el producto no respondió en :8000" }
            $root = Invoke-WebRequest -Uri "https://127.0.0.1:8000/" `
              -SkipCertificateCheck -TimeoutSec 5
            if ($root.Content -notmatch "(?i)<html") {
              throw "la raíz no sirve el HTML de la UI"
            }
            $health = Invoke-WebRequest -Uri "https://127.0.0.1:8000/api/health" `
              -SkipCertificateCheck -TimeoutSec 5
            if ($health.Content -notmatch "version") {
              throw "la API no responde en el origen de producto"
            }
            $missing = Invoke-WebRequest -Uri "https://127.0.0.1:8000/api/no-existe" `
              -SkipCertificateCheck -SkipHttpErrorCheck -TimeoutSec 5
            if ($missing.StatusCode -ne 404) {
              throw "/api inexistente devolvió $($missing.StatusCode) (esperaba 404)"
            }
            Write-Host "OK: la UI compilada se sirve por HTTPS en Windows"
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }
